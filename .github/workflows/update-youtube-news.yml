name: Update Voice of Peace YouTube News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  update-youtube-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp


      - name: Collect latest YouTube news videos
        run: |

          python <<'PY'

          import json
          import os
          from datetime import datetime, timezone

          from yt_dlp import YoutubeDL


          SOURCES = [

              {
                  "source": "Fox News",
                  "url": "https://www.youtube.com/@FoxNews/videos"
              },

              {
                  "source": "Newsmax",
                  "url": "https://www.youtube.com/@NewsmaxTV/videos"
              },

              {
                  "source": "OAN",
                  "url": "https://www.youtube.com/@oann/videos"
              },

              {
                  "source": "Breitbart",
                  "url": "https://www.youtube.com/@breitbartnews92/videos"
              },

              {
                  "source": "Daily Wire",
                  "url": "https://www.youtube.com/@DailyWire/videos"
              }

          ]


          all_videos = []


          ydl_options = {

              "quiet": True,

              "no_warnings": True,

              "extract_flat": True,

              "skip_download": True,

              "playlistend": 8,

              "ignoreerrors": True

          }


          with YoutubeDL(ydl_options) as ydl:

              for source in SOURCES:

                  print(
                      "\nChecking:",
                      source["source"]
                  )


                  try:

                      info = ydl.extract_info(
                          source["url"],
                          download=False
                      )


                      if not info:

                          print(
                              "No information returned for",
                              source["source"]
                          )

                          continue


                      entries = (
                          info.get("entries")
                          or []
                      )


                      saved_count = 0


                      for entry in entries:

                          if not entry:
                              continue


                          video_id = (
                              entry.get("id")
                              or ""
                          ).strip()


                          title = (
                              entry.get("title")
                              or
                              "Latest video report"
                          ).strip()


                          if not video_id:
                              continue


                          video_url = (
                              "https://www.youtube.com/watch?v="
                              +
                              video_id
                          )


                          embed_url = (
                              "https://www.youtube.com/embed/"
                              +
                              video_id
                              +
                              "?rel=0"
                          )


                          thumbnail = (
                              "https://i.ytimg.com/vi/"
                              +
                              video_id
                              +
                              "/hqdefault.jpg"
                          )


                          all_videos.append({

                              "source":
                                  source["source"],

                              "video_id":
                                  video_id,

                              "title":
                                  title,

                              "url":
                                  video_url,

                              "embed_url":
                                  embed_url,

                              "thumbnail":
                                  thumbnail

                          })


                          saved_count += 1


                          if saved_count >= 5:
                              break


                      print(
                          source["source"],
                          "videos saved:",
                          saved_count
                      )


                  except Exception as error:

                      print(
                          "ERROR checking",
                          source["source"],
                          ":",
                          error
                      )


          result = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "videos":
                  all_videos

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          output_file = (
              "data/youtube-news.json"
          )


          with open(
              output_file,
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  result,
                  file,
                  indent=2,
                  ensure_ascii=False
              )


          print(
              "\n================================"
          )

          print(
              "TOTAL VIDEOS SAVED:",
              len(all_videos)
          )

          print(
              "FILE:",
              output_file
          )

          print(
              "================================"
          )


          for source in SOURCES:

              count = len([
                  video
                  for video
                  in all_videos
                  if video["source"]
                  ==
                  source["source"]
              ])

              print(
                  source["source"],
                  ":",
                  count
              )

          PY


      - name: Show generated YouTube file
        run: |
          echo "===== youtube-news.json ====="
          cat data/youtube-news.json
          echo "============================="


      - name: Commit updated YouTube news
        run: |

          git config user.name \
            "Voice of Peace News Bot"

          git config user.email \
            "actions@github.com"

          git add \
            data/youtube-news.json

          if git diff \
            --cached \
            --quiet
          then

            echo "No YouTube changes"

          else

            git commit \
              -m \
              "Update Voice of Peace YouTube news"

            git push

          fi
