<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice of Peace TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#08395f,#031d33);color:white;font-family:Arial,sans-serif}
header{padding:22px 20px;border-bottom:3px solid #2878a8;background:#07385d}
.top{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.kicker{color:#55d5ff;letter-spacing:8px;font-weight:900;font-size:14px}
.logo{font-size:34px;font-weight:1000;margin-top:6px}.by{color:#ffd84d;font-weight:900;font-size:18px;margin-top:5px}
.live{background:#10c66d;padding:15px 23px;border-radius:40px;font-weight:1000}
.wrap{width:min(900px,96%);margin:34px auto}
.card{padding:28px;border:2px solid #2a648c;border-radius:27px;background:linear-gradient(145deg,#0a3d64,#062944)}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}
.heading h1{font-size:36px;margin:0}.badge{background:#a63245;padding:13px 18px;border-radius:40px;font-weight:1000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.ch{min-height:112px;border:2px solid #3180b1;border-radius:20px;background:linear-gradient(145deg,#0b4b78,#073453);color:#fff;padding:14px 9px;text-align:center}
.ch b{display:block;color:#ffd84d;font-size:16px;margin-bottom:8px}.ch span{font-size:19px;font-weight:1000}
.ch.active{border:4px solid #ffd84d;box-shadow:0 0 0 5px rgba(255,216,77,.17)}
.player{margin-top:26px;aspect-ratio:16/9;background:#000;border:2px solid #16557c;border-radius:21px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0}
.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#ccdbe5}
.now{text-align:center;margin-top:15px;font-size:18px;font-weight:900}
.add{margin-top:24px;padding:22px;border:2px solid #2a648c;border-radius:23px;background:#062b48}
.add h2{margin:0 0 7px;color:#ffd84d}.add p{color:#c8dfef;margin:5px 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:9px}
input{min-width:0;padding:14px;border:2px solid #347eaa;border-radius:12px;background:#021a2d;color:white;font-size:16px}
button.addbtn{border:0;border-radius:12px;background:#ffd84d;color:#132a3e;font-weight:1000;padding:13px 17px}
.customList{margin-top:15px;display:grid;gap:9px}
.customItem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#083b60;border:1px solid #327da9;border-radius:13px;padding:10px}
.customItem button{border:0;border-radius:9px;padding:9px 12px;font-weight:900}
.play{background:#10b96a;color:white}.del{background:#a63245;color:white}
@media(max-width:650px){
 header{padding:20px 17px}.logo{font-size:28px}.by{font-size:16px}.kicker{font-size:12px;letter-spacing:6px}.live{padding:13px 18px}
 .card{padding:25px 14px}.heading h1{font-size:28px}.grid{gap:13px}.ch{min-height:106px}.ch span{font-size:17px}
 .form{grid-template-columns:1fr}.addbtn{width:100%}
}
</style>
</head>
<body>
<header><div class="top"><div><div class="kicker">THIS IS THE</div><div class="logo">VOICE OF PEACE</div><div class="by">By Emmanuel &amp; Camili Hileah</div></div><div class="live">LIVE</div></div></header>

<main class="wrap">
<section class="card">
<div class="heading"><h1>📺 Voice of Peace Live TV</h1><div class="badge" id="badge">SELECT</div></div>
<div class="grid" id="grid"></div>
<div class="player" id="player"><div class="empty"><h2>Select one of the 10 channels</h2></div></div>
<div class="now">NOW PLAYING: <strong id="now">Choose a channel</strong></div>
</section>

<section class="add">
<h2>➕ Add My Own Channels</h2>
<p>Add any YouTube video/live link. Your added channels are saved on this device.</p>
<div class="form">
<input id="name" placeholder="Channel name">
<input id="url" placeholder="YouTube link">
<button class="addbtn" id="addBtn">+ ADD CHANNEL</button>
</div>
<div class="customList" id="customList"></div>
</section>
</main>

<script>
const channels=[
["✡️ Rabbi Zamir Cohen","Y5CBvFVXG40"],
["🇮🇱 Hebrew News — Channel 14",""],
["🇺🇸 Fox News",""],
["🌎 Discovery Channel",""],
["😂 Comedy","ZvdiJUYGBis"],
["💡 Inventions","P11y8N22Rq0"],
["💰 Business Ideas","oPtapPqfO_0"],
["🇮🇱 Israel History","kNuwCiuDz4E"],
["🎵 Israel 80th Music",""],
["🤠 Old Western — Full Length",""]
];

const grid=document.getElementById("grid"),player=document.getElementById("player"),now=document.getElementById("now"),badge=document.getElementById("badge");

channels.forEach((c,i)=>{
 const b=document.createElement("button"); b.className="ch";
 b.innerHTML="<b>CHANNEL "+(i+1)+"</b><span>"+c[0]+"</span>";
 b.onclick=()=>playMain(i); grid.appendChild(b);
});

function youtubeId(s){
 try{
  let u=new URL(s);
  if(u.hostname.includes("youtu.be")) return u.pathname.slice(1);
  if(u.pathname.includes("/shorts/")) return u.pathname.split("/shorts/")[1].split("/")[0];
  if(u.pathname.includes("/live/")) return u.pathname.split("/live/")[1].split("/")[0];
  return u.searchParams.get("v");
 }catch(e){return null}
}
function embed(id,name){
 now.textContent=name; badge.textContent="PLAYING";
 player.innerHTML='<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0"></iframe>';
}
function playMain(i){
 [...grid.children].forEach((x,n)=>x.classList.toggle("active",n===i));
 const c=channels[i]; now.textContent=c[0];
 if(c[1]) embed(c[1],c[0]);
 else {badge.textContent="ADD LINK";player.innerHTML='<div class="empty"><div><h2>'+c[0]+'</h2><p>Add a working YouTube link for this channel below.</p></div></div>'}
}

const KEY="voiceOfPeaceCustomChannels";
function loadCustom(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function saveCustom(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function drawCustom(){
 const box=document.getElementById("customList"),a=loadCustom();box.innerHTML="";
 a.forEach((c,i)=>{
  const d=document.createElement("div");d.className="customItem";
  d.innerHTML='<strong>'+c.name+'</strong><div><button class="play">▶ Play</button> <button class="del">Delete</button></div>';
  d.querySelector(".play").onclick=()=>{const id=youtubeId(c.url);if(id)embed(id,c.name)};
  d.querySelector(".del").onclick=()=>{const x=loadCustom();x.splice(i,1);saveCustom(x);drawCustom()};
  box.appendChild(d);
 });
}
document.getElementById("addBtn").onclick=()=>{
 const name=document.getElementById("name").value.trim(),url=document.getElementById("url").value.trim();
 if(!name||!youtubeId(url)){alert("Enter a channel name and a valid YouTube video/live link.");return}
 const a=loadCustom();a.push({name,url});saveCustom(a);
 document.getElementById("name").value="";document.getElementById("url").value="";drawCustom();
};
drawCustom();
</script>
</body>
</html>
