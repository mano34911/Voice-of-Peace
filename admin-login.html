<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">

<title>Voice of Peace - Admin Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0c4f7e 0,#062c4f 35%,#02182e 70%,#010b15 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:560px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
}

.logo h1{
  margin:0;
  font-size:38px;
  letter-spacing:3px;
}

.logo p{
  margin-top:10px;
  color:#4bd0ff;
  font-size:22px;
}

h2{
  text-align:center;
  margin-top:30px;
}

.notice{
  background:#0a3d64;
  border:1px solid #2c73a0;
  border-radius:12px;
  padding:12px;
  text-align:center;
  color:#c9efff;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:14px;
  font-weight:700;
}

input,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #2b6c99;
  font-size:16px;
  box-sizing:border-box;
}

input{
  background:#fff;
  color:#111;
}

button{
  margin-top:20px;
  background:#13b868;
  color:white;
  font-weight:800;
  border:0;
  cursor:pointer;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  margin-top:16px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="logo">
      <h1>VOICE OF PEACE</h1>
      <p>Administrator</p>
    </div>

    <h2>Admin Login</h2>

    <div class="notice">
      Temporary admin access is enabled.
    </div>

    <form id="adminForm">

      <label>Email</label>
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button type="submit">
        ADMIN LOGIN
      </button>

    </form>

    <a class="link" href="login.html">
      Member Login
    </a>

    <a class="link" href="index.html">
      Return to Voice of Peace
    </a>

  </div>
</div>

<script>
document
  .getElementById("adminForm")
  .addEventListener("submit", function(event){

    event.preventDefault();

    // TEMPORARY OPEN ADMIN ACCESS
    // No Supabase
    // No getClient
    // No authentication check

    localStorage.setItem(
      "voiceOfPeaceAdmin",
      "granted"
    );

    window.location.href = "admin.html";
  });
</script>

</body>
</html>
