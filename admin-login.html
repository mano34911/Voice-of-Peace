<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">

<title>Voice of Peace - Admin Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0c4f7e 0,#062c4f 35%,#02182e 70%,#010b15 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:600px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  margin:0 0 6px;
  font-size:34px;
}

.subtitle{
  text-align:center;
  color:#89d9ff;
  margin-bottom:24px;
}

h2{
  text-align:center;
  font-size:32px;
  margin:10px 0 20px;
}

label{
  display:block;
  font-size:18px;
  font-weight:700;
  margin:18px 0 8px;
}

input{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #4f9dd0;
  font-size:18px;
  outline:none;
}

button{
  width:100%;
  margin-top:24px;
  padding:17px;
  border:0;
  border-radius:14px;
  background:#13be68;
  color:#fff;
  font-size:22px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.msg{
  min-height:28px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

.error{
  color:#ff8b8b;
}

.success{
  color:#7cffb0;
}

.link{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#54d3ff;
  text-decoration:none;
  font-size:18px;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>VOICE OF PEACE</h1>
    <div class="subtitle">Administrator</div>

    <h2>Admin Login</h2>

    <div id="msg" class="msg"></div>

    <form id="loginForm">

      <label>Email</label>
      <input
        id="email"
        type="email"
        value="mano3491@gmail.com"
        autocomplete="email"
        autocapitalize="none"
        spellcheck="false"
        required
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        ADMIN LOGIN
      </button>

    </form>

    <a class="link" href="login.html">
      Member login
    </a>

  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dpejswtreoqzmrlcnfde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_92C4dFnhmFBCsasew_6WhQ_InvX4yDX";

const ADMIN_EMAIL =
  "mano3491@gmail.com";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("loginForm");

const msg =
  document.getElementById("msg");

const button =
  document.getElementById("loginButton");


function showMessage(text,type="error"){
  msg.textContent=text;
  msg.className="msg "+type;
}


form.addEventListener("submit",async function(e){

  e.preventDefault();

  showMessage("");

  const email =
    document.getElementById("email")
    .value
    .trim()
    .toLowerCase();

  const password =
    document.getElementById("password")
    .value;


  if(email !== ADMIN_EMAIL){

    showMessage(
      "This email is not authorized as administrator."
    );

    return;
  }


  button.disabled=true;
  button.textContent="CHECKING...";


  try{

    const {
      data,
      error
    } =
    await client.auth.signInWithPassword({

      email:email,

      password:password

    });


    if(error){

      console.error(error);

      showMessage(
        "Invalid email or password."
      );

      return;
    }


    if(
      !data.user ||
      data.user.email.toLowerCase() !== ADMIN_EMAIL
    ){

      await client.auth.signOut();

      showMessage(
        "Administrator verification failed."
      );

      return;
    }


    localStorage.setItem(
      "voicepeace_admin",
      "true"
    );

    localStorage.setItem(
      "voicepeace_admin_email",
      email
    );


    showMessage(
      "Login successful.",
      "success"
    );


    setTimeout(function(){

      window.location.href =
        "admin.html";

    },500);


  }
  catch(err){

    console.error(err);

    showMessage(
      "Login error. Please try again."
    );

  }
  finally{

    button.disabled=false;

    button.textContent=
      "ADMIN LOGIN";

  }

});


(async function(){

  const {
    data
  } =
  await client.auth.getSession();

  if(
    data.session &&
    data.session.user &&
    data.session.user.email &&
    data.session.user.email.toLowerCase()
      === ADMIN_EMAIL
  ){

    localStorage.setItem(
      "voicepeace_admin",
      "true"
    );

  }

})();

</script>

</body>
</html>
