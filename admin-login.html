<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta http-equiv="Cache-Control" content="no-store">

<title>Voice of Peace - Admin Login</title>

<link rel="stylesheet" href="common.css">

<style>
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0c4f7e 0,#062c4f 35%,#02182e 70%,#010b15 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:560px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:24px;
  box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
}

.logo h1{
  margin:0;
  font-size:34px;
}

.logo p{
  color:#4bd0ff;
  margin-top:6px;
}

h2{
  text-align:center;
  font-size:30px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:8px;
  font-size:18px;
  font-weight:bold;
}

input{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #2b6c99;
  box-sizing:border-box;
  font-size:18px;
}

button{
  width:100%;
  padding:17px;
  margin-top:22px;
  border-radius:14px;
  border:0;
  background:#13b868;
  color:#fff;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.65;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  margin-top:24px;
  font-size:18px;
  text-decoration:none;
}

.msg{
  text-align:center;
  min-height:28px;
  margin:10px 0;
  font-weight:bold;
}

.msg.error{
  color:#ff8d8d;
}

.msg.success{
  color:#5dff9d;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="logo">
<h1>VOICE OF PEACE</h1>
<p>Administrator</p>
</div>

<h2>Admin Login</h2>

<div id="msg" class="msg"></div>

<form id="form">

<label for="email">Email</label>

<input
  id="email"
  type="email"
  autocomplete="email"
  autocapitalize="none"
  spellcheck="false"
  required
>

<label for="password">Password</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
  required
>

<button id="submit" type="submit">
ADMIN LOGIN
</button>

</form>

<a class="link" href="login.html">
Member login
</a>

</div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   VOICE OF PEACE
   SUPABASE SETTINGS
===================================================== */

const SUPABASE_URL =
"https://dpejswtreoqzmrlcnfde.supabase.co";

const SUPABASE_KEY =
"sb_publishable_92C4dFnhmFBCsasew_6WhQ_InvX4yDX";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const form =
document.getElementById("form");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const submitButton =
document.getElementById("submit");

const msg =
document.getElementById("msg");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type=""){

  msg.textContent=text;

  msg.className="msg";

  if(type){
    msg.classList.add(type);
  }

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();

showMessage("");

submitButton.disabled=true;
submitButton.textContent="CHECKING...";


try{

/* ---------------------------
   EMAIL / PASSWORD
---------------------------- */

const email =
emailInput.value
.trim()
.toLowerCase();

const password =
passwordInput.value;


/* ---------------------------
   LOGIN TO SUPABASE AUTH
---------------------------- */

const {
  data:loginData,
  error:loginError
} =
await supabaseClient.auth.signInWithPassword({

  email:email,
  password:password

});


if(loginError){
  throw loginError;
}


if(!loginData || !loginData.user){

  throw new Error(
    "Login succeeded but no user account was returned."
  );

}


const user =
loginData.user;


/* ---------------------------
   GET PROFILE
---------------------------- */

const {
  data:profile,
  error:profileError
} =
await supabaseClient
.from("profiles")
.select("id,email,role,status")
.eq("id",user.id)
.maybeSingle();


if(profileError){

  await supabaseClient.auth.signOut();

  throw new Error(
    "Profile error: " +
    profileError.message
  );

}


/* ---------------------------
   PROFILE MUST EXIST
---------------------------- */

if(!profile){

  await supabaseClient.auth.signOut();

  throw new Error(
    "Your account exists, but no profile record was found."
  );

}


/* ---------------------------
   CHECK ADMIN ROLE
---------------------------- */

const role =
String(profile.role || "")
.trim()
.toLowerCase();

const status =
String(profile.status || "")
.trim()
.toLowerCase();


if(role !== "admin"){

  await supabaseClient.auth.signOut();

  throw new Error(
    "This account is not an administrator."
  );

}


/* ---------------------------
   CHECK APPROVAL
---------------------------- */

if(status !== "approved"){

  await supabaseClient.auth.signOut();

  throw new Error(
    "Administrator account is not approved."
  );

}


/* ---------------------------
   SUCCESS
---------------------------- */

showMessage(
  "Admin login successful. Opening dashboard...",
  "success"
);


/* ---------------------------
   ADMIN DASHBOARD
---------------------------- */

setTimeout(function(){

  window.location.href="admin.html";

},500);


}

catch(error){

console.error(
  "ADMIN LOGIN ERROR:",
  error
);

showMessage(
  error.message ||
  "Admin login failed.",
  "error"
);

submitButton.disabled=false;
submitButton.textContent="ADMIN LOGIN";

}

});



/* =====================================================
   IF ALREADY LOGGED IN
===================================================== */

async function checkExistingAdmin(){

try{

const {
  data
} =
await supabaseClient.auth.getSession();


if(
  !data ||
  !data.session ||
  !data.session.user
){
  return;
}


const user =
data.session.user;


const {
  data:profile
} =
await supabaseClient
.from("profiles")
.select("role,status")
.eq("id",user.id)
.maybeSingle();


if(!profile){
  return;
}


const role =
String(profile.role || "")
.toLowerCase();

const status =
String(profile.status || "")
.toLowerCase();


if(
  role === "admin" &&
  status === "approved"
){

  showMessage(
    "Administrator already logged in.",
    "success"
  );

}

}
catch(error){

console.log(
  "Session check:",
  error
);

}

}


checkExistingAdmin();

</script>

</body>
</html>
