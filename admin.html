<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta http-equiv="Cache-Control" content="no-store">

<title>Voice of Peace - Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #0c4f7e 0,
      #062c4f 35%,
      #02182e 70%,
      #010b15 100%
    );
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  text-align:center;
  padding:28px 15px 18px;
}

header h1{
  margin:0;
  font-size:38px;
  letter-spacing:3px;
}

header p{
  margin:8px 0;
  color:#4bd0ff;
  font-size:20px;
}

.open{
  display:inline-block;
  background:#117147;
  padding:7px 14px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.wrap{
  width:95%;
  max-width:1100px;
  margin:auto;
  padding-bottom:60px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.navigation{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

button,
.btn{
  display:block;
  border:0;
  border-radius:11px;
  padding:13px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  color:#fff;
  text-align:center;
}

.blue{
  background:#247bb1;
}

.green{
  background:#13a963;
}

.orange{
  background:#c77a16;
}

.red{
  background:#bd4141;
}

.gray{
  background:#566b7c;
}

#message{
  text-align:center;
  min-height:24px;
  margin:12px 0;
  font-weight:bold;
  color:#65d9ff;
}

.error{
  color:#ff8b8b !important;
}

.success{
  color:#61e697 !important;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#031b30;
  border:1px solid #275f85;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:28px;
  color:#58d4ff;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #3179a7;
  border-radius:12px;
  background:#031b30;
  color:white;
  font-size:16px;
  margin-bottom:18px;
}

.member{
  background:#031b30;
  border:1px solid #275f85;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
}

.memberTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.memberName{
  font-size:20px;
  font-weight:800;
}

.status{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:900;
}

.status.active{
  background:#117147;
}

.status.suspended{
  background:#9e3636;
}

.status.pending{
  background:#a66c13;
}

.info{
  margin-top:12px;
  color:#c9e8fa;
  line-height:1.7;
  word-break:break-word;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:15px;
}

.editBox{
  display:none;
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid #275f85;
}

.editBox.show{
  display:block;
}

label{
  display:block;
  margin:8px 0 4px;
  color:#bfe4f8;
  font-size:14px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #3179a7;
  border-radius:10px;
  background:white;
  color:#111;
  font-size:16px;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#9dc5dc;
}

@media(max-width:700px){

  .navigation,
  .stats{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr 1fr;
  }

  .memberTop{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<header>

<h1>VOICE OF PEACE</h1>

<p>Administrator Control Panel</p>

<div class="open">
DIRECT ADMIN ACCESS
</div>

</header>


<div class="wrap">

<div class="card">

<div class="navigation">

<a class="btn blue"
href="index.html">
🏠 MAIN PAGE
</a>

<a class="btn green"
href="register.html">
➕ REGISTER MEMBER
</a>

<button class="gray"
onclick="loadMembers()">
🔄 REFRESH MEMBERS
</button>

</div>

<div id="message"></div>

</div>


<div class="stats">

<div class="stat">
<strong id="totalCount">0</strong>
TOTAL MEMBERS
</div>

<div class="stat">
<strong id="activeCount">0</strong>
ACTIVE
</div>

<div class="stat">
<strong id="suspendedCount">0</strong>
SUSPENDED
</div>

</div>


<div class="card">

<h2>👥 Members</h2>

<input
id="search"
class="search"
placeholder="Search by name, email or phone..."
oninput="renderMembers()"
>

<div id="members">
Loading members...
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://dpejswtreoqzmrlcnfde.supabase.co";

const SUPABASE_KEY =
"sb_publishable_92C4dFnhmFBCsasew_6WhQ_InvX4yDX";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allMembers = [];


/* ==============================
   MESSAGE
============================== */

function showMessage(text,type=""){

  const box =
  document.getElementById("message");

  box.textContent = text;

  box.className = type;

}


/* ==============================
   ESCAPE HTML
============================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ==============================
   LOAD MEMBERS
============================== */

async function loadMembers(){

  showMessage(
    "Loading members..."
  );

  document.getElementById(
    "members"
  ).innerHTML =
    '<div class="empty">Loading members...</div>';

  try{

    const {
      data,
      error
    } =
    await db
      .from("members")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

    if(error){

      console.error(
        "Supabase load error:",
        error
      );

      showMessage(
        "Error loading members: " +
        error.message,
        "error"
      );

      document.getElementById(
        "members"
      ).innerHTML =
        '<div class="empty">Unable to load members.</div>';

      return;

    }

    console.log(
      "Members received:",
      data
    );

    allMembers =
      Array.isArray(data)
      ? data
      : [];

    updateStatistics();

    renderMembers();

    showMessage(
      allMembers.length +
      " member" +
      (
        allMembers.length === 1
        ? ""
        : "s"
      ) +
      " loaded.",
      "success"
    );

  }
  catch(err){

    console.error(err);

    showMessage(
      "Connection error: " +
      err.message,
      "error"
    );

  }

}


/* ==============================
   STATISTICS
============================== */

function updateStatistics(){

  const active =
    allMembers.filter(
      member =>
        String(
          member.status || ""
        ).toLowerCase()
        === "active"
    ).length;

  const suspended =
    allMembers.filter(
      member =>
        String(
          member.status || ""
        ).toLowerCase()
        === "suspended"
    ).length;

  document.getElementById(
    "totalCount"
  ).textContent =
    allMembers.length;

  document.getElementById(
    "activeCount"
  ).textContent =
    active;

  document.getElementById(
    "suspendedCount"
  ).textContent =
    suspended;

}


/* ==============================
   RENDER MEMBERS
============================== */

function renderMembers(){

  const container =
    document.getElementById(
      "members"
    );

  const search =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toLowerCase();

  const members =
    allMembers.filter(
      member => {

        const searchText =
          [
            member.name,
            member.full_name,
            member.email,
            member.phone,
            member.status
          ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return searchText.includes(
          search
        );

      }
    );

  if(members.length === 0){

    container.innerHTML = `

      <div class="empty">

        No members found.

      </div>

    `;

    return;

  }

  container.innerHTML = "";

  members.forEach(
    member => {

      const id =
        member.id;

      const name =
        member.name ||
        member.full_name ||
        member.email ||
        "Member";

      const status =
        String(
          member.status ||
          "active"
        ).toLowerCase();

      let statusClass =
        "active";

      if(
        status ===
        "suspended"
      ){

        statusClass =
          "suspended";

      }
      else if(
        status ===
        "pending"
      ){

        statusClass =
          "pending";

      }

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "member";

      box.innerHTML = `

        <div class="memberTop">

          <div class="memberName">

            ${escapeHtml(name)}

          </div>

          <div class="status ${statusClass}">

            ${escapeHtml(
              status.toUpperCase()
            )}

          </div>

        </div>


        <div class="info">

          <strong>Email:</strong>

          ${escapeHtml(
            member.email || ""
          )}

          <br>

          <strong>Phone:</strong>

          ${escapeHtml(
            member.phone || ""
          )}

          <br>

          <strong>Status:</strong>

          ${escapeHtml(status)}

          <br>

          <strong>Member ID:</strong>

          ${escapeHtml(id)}

          <br>

          <strong>Joined:</strong>

          ${
            member.created_at
            ?
            escapeHtml(
              new Date(
                member.created_at
              ).toLocaleString()
            )
            :
            ""
          }

        </div>


        <div class="actions">

          <button
          class="blue"
          onclick='toggleEdit(${JSON.stringify(String(id))})'>
          ✏️ EDIT
          </button>


          <button
          class="green"
          onclick='setStatus(${JSON.stringify(String(id))},"active")'>
          ✓ ACTIVATE
          </button>


          <button
          class="orange"
          onclick='setStatus(${JSON.stringify(String(id))},"suspended")'>
          ⏸ SUSPEND
          </button>


          <button
          class="red"
          onclick='deleteMember(${JSON.stringify(String(id))})'>
          🗑 DELETE
          </button>

        </div>


        <div
        id="edit-${escapeHtml(id)}"
        class="editBox">

          <label>
          Full Name
          </label>

          <input
          id="name-${escapeHtml(id)}"
          value="${escapeHtml(
            member.name ||
            member.full_name ||
            ""
          )}">


          <label>
          Email
          </label>

          <input
          id="email-${escapeHtml(id)}"
          value="${escapeHtml(
            member.email || ""
          )}">


          <label>
          Phone
          </label>

          <input
          id="phone-${escapeHtml(id)}"
          value="${escapeHtml(
            member.phone || ""
          )}">


          <button
          class="green"
          style="
            margin-top:12px;
            width:100%;
          "
          onclick='saveMember(${JSON.stringify(String(id))})'>

          💾 SAVE CHANGES

          </button>

        </div>

      `;

      container.appendChild(
        box
      );

    }
  );

}


/* ==============================
   EDIT BOX
============================== */

function toggleEdit(id){

  const box =
    document.getElementById(
      "edit-" + id
    );

  if(box){

    box.classList.toggle(
      "show"
    );

  }

}


/* ==============================
   SAVE MEMBER
============================== */

async function saveMember(id){

  const name =
    document.getElementById(
      "name-" + id
    ).value.trim();

  const email =
    document.getElementById(
      "email-" + id
    ).value.trim();

  const phone =
    document.getElementById(
      "phone-" + id
    ).value.trim();

  showMessage(
    "Saving member..."
  );

  const member =
    allMembers.find(
      m =>
        String(m.id) ===
        String(id)
    );

  let updates = {
    email:email,
    phone:phone
  };

  /*
   Some versions of your members table
   may use "name", while others may
   use "full_name".
  */

  if(
    member &&
    Object.prototype.hasOwnProperty.call(
      member,
      "name"
    )
  ){

    updates.name =
      name;

  }

  if(
    member &&
    Object.prototype.hasOwnProperty.call(
      member,
      "full_name"
    )
  ){

    updates.full_name =
      name;

  }

  const {
    data,
    error
  } =
  await db
    .from("members")
    .update(updates)
    .eq(
      "id",
      id
    )
    .select();

  if(error){

    console.error(error);

    showMessage(
      "Save failed: " +
      error.message,
      "error"
    );

    return;

  }

  console.log(
    "Updated:",
    data
  );

  showMessage(
    "Member updated successfully.",
    "success"
  );

  await loadMembers();

}


/* ==============================
   ACTIVATE / SUSPEND
============================== */

async function setStatus(
  id,
  status
){

  showMessage(
    status === "active"
    ?
    "Activating member..."
    :
    "Suspending member..."
  );

  const {
    data,
    error
  } =
  await db
    .from("members")
    .update({
      status:status
    })
    .eq(
      "id",
      id
    )
    .select();

  if(error){

    console.error(error);

    showMessage(
      "Status update failed: " +
      error.message,
      "error"
    );

    return;

  }

  console.log(
    "Status updated:",
    data
  );

  showMessage(
    status === "active"
    ?
    "Member activated."
    :
    "Member suspended.",
    "success"
  );

  await loadMembers();

}


/* ==============================
   DELETE MEMBER
============================== */

async function deleteMember(id){

  const member =
    allMembers.find(
      m =>
        String(m.id) ===
        String(id)
    );

  const memberName =
    member?.name ||
    member?.full_name ||
    member?.email ||
    "this member";

  const confirmed =
    confirm(
      "Permanently delete " +
      memberName +
      "?"
    );

  if(!confirmed){

    return;

  }

  showMessage(
    "Deleting member..."
  );

  const {
    data,
    error
  } =
  await db
    .from("members")
    .delete()
    .eq(
      "id",
      id
    )
    .select();

  if(error){

    console.error(error);

    showMessage(
      "Delete failed: " +
      error.message,
      "error"
    );

    return;

  }

  console.log(
    "Deleted:",
    data
  );

  showMessage(
    "Member deleted.",
    "success"
  );

  await loadMembers();

}


/* ==============================
   START
============================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    loadMembers();

  }
);

</script>

</body>
</html>
