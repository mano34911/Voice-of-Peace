<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">

<title>Voice of Peace - Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#02182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.header{
  background:#062746;
  border-bottom:1px solid #245d88;
  padding:20px;
  text-align:center;
}

.header h1{
  margin:0;
  letter-spacing:2px;
}

.header p{
  margin:8px 0 0;
  color:#4bd0ff;
}

.wrap{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
}

input,
select,
textarea,
button{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #2b6c99;
  font-size:16px;
}

input,
select,
textarea{
  background:#fff;
  color:#111;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  background:#13b868;
  color:#fff;
  border:0;
  font-weight:800;
  cursor:pointer;
}

.secondary{
  background:#2877a8;
}

.danger{
  background:#c94747;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.status{
  text-align:center;
  color:#69ddff;
  margin-bottom:20px;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  text-decoration:none;
  margin-top:20px;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>VOICE OF PEACE</h1>
  <p>Admin Control Panel</p>
</div>

<div class="wrap">

  <div class="status">
    Temporary open admin access enabled
  </div>

  <div class="card">
    <h2>Channel Settings</h2>

    <label>Channel Name</label>
    <input id="channelName" placeholder="Example: Fox News">

    <label>Category</label>
    <input id="category" placeholder="Example: News">

    <label>YouTube URL</label>
    <input id="youtubeUrl" placeholder="Paste YouTube link">

    <button onclick="addChannel()">
      ADD CHANNEL
    </button>
  </div>

  <div class="card">
    <h2>Main Message</h2>

    <textarea id="message" placeholder="Enter Voice of Peace message"></textarea>

    <button onclick="saveMessage()">
      SAVE MESSAGE
    </button>
  </div>

  <div class="card">
    <h2>Site Controls</h2>

    <div class="grid">
      <button class="secondary" onclick="openSite()">
        OPEN VOICE OF PEACE
      </button>

      <button class="secondary" onclick="openMusic()">
        OPEN MUSIC
      </button>

      <button class="secondary" onclick="openRegister()">
        OPEN REGISTRATION
      </button>

      <button class="danger" onclick="clearLocalData()">
        CLEAR LOCAL DATA
      </button>
    </div>
  </div>

  <div class="card">
    <h2>Saved Channels</h2>

    <div id="channelList">
      No channels added yet.
    </div>
  </div>

  <a class="link" href="index.html">
    Return to Voice of Peace
  </a>

</div>

<script>
const STORAGE_CHANNELS = "voiceOfPeaceChannels";
const STORAGE_MESSAGE = "voiceOfPeaceMessage";

function getChannels(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_CHANNELS)) || [];
  }catch(e){
    return [];
  }
}

function saveChannels(channels){
  localStorage.setItem(
    STORAGE_CHANNELS,
    JSON.stringify(channels)
  );
}

function addChannel(){

  const name =
    document.getElementById("channelName").value.trim();

  const category =
    document.getElementById("category").value.trim();

  const url =
    document.getElementById("youtubeUrl").value.trim();

  if(!name || !url){
    alert("Enter a channel name and YouTube URL.");
    return;
  }

  const channels = getChannels();

  channels.push({
    id: Date.now(),
    name:name,
    category:category,
    url:url
  });

  saveChannels(channels);

  document.getElementById("channelName").value = "";
  document.getElementById("category").value = "";
  document.getElementById("youtubeUrl").value = "";

  renderChannels();
}

function deleteChannel(id){

  let channels = getChannels();

  channels = channels.filter(
    channel => channel.id !== id
  );

  saveChannels(channels);
  renderChannels();
}

function renderChannels(){

  const box =
    document.getElementById("channelList");

  const channels = getChannels();

  if(channels.length === 0){
    box.innerHTML = "No channels added yet.";
    return;
  }

  box.innerHTML = "";

  channels.forEach(channel => {

    const item =
      document.createElement("div");

    item.style.padding = "14px";
    item.style.marginBottom = "12px";
    item.style.background = "#0a3557";
    item.style.borderRadius = "12px";

    item.innerHTML = `
      <strong>${escapeHtml(channel.name)}</strong>
      <br>
      ${escapeHtml(channel.category || "Uncategorized")}
      <br>
      <small>${escapeHtml(channel.url)}</small>
      <br><br>
      <button
        class="danger"
        onclick="deleteChannel(${channel.id})">
        DELETE
      </button>
    `;

    box.appendChild(item);
  });
}

function saveMessage(){

  const message =
    document.getElementById("message").value;

  localStorage.setItem(
    STORAGE_MESSAGE,
    message
  );

  alert("Message saved.");
}

function loadMessage(){

  const message =
    localStorage.getItem(STORAGE_MESSAGE) || "";

  document.getElementById("message").value =
    message;
}

function openSite(){
  window.location.href = "index.html";
}

function openMusic(){
  window.location.href = "music.html";
}

function openRegister(){
  window.location.href = "register.html";
}

function clearLocalData(){

  if(!confirm("Clear saved Voice of Peace data?")){
    return;
  }

  localStorage.removeItem(STORAGE_CHANNELS);
  localStorage.removeItem(STORAGE_MESSAGE);

  renderChannels();
  loadMessage();
}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadMessage();
renderChannels();
</script>

</body>
</html>
