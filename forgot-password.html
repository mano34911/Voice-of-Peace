<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice of Peace - Forgot Password</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap"><div class="card">
  <div class="logo"><h1>VOICE OF PEACE</h1><p>Password Recovery</p></div>
  <div id="msg" class="msg"></div>
  <form id="form">
    <label>Email</label>
    <input id="email" type="email" required>
    <button id="submit" type="submit">SEND RESET LINK</button>
  </form>
  <a class="link" href="login.html">Back to login</a>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const msg=document.getElementById("msg");
function show(t,c=""){msg.textContent=t;msg.className="msg "+c;}
document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("submit");
  btn.disabled=true;
  try{
    const email=document.getElementById("email").value.trim().toLowerCase();
    const {error}=await getClient().auth.resetPasswordForEmail(email,{redirectTo:cfg("BASE_URL")+cfg("RESET_PAGE")});
    if(error) throw error;
    show("Password reset email sent. Check your inbox.","success");
  }catch(err){
    show(err.message,"error");
    btn.disabled=false;
  }
});
</script>
</body></html>
