const CHANNEL_ORDER = [
  "israel",
  "usnews",
  "comedy",
  "comedymovies",
  "shorts",
  "travel",
  "animals",
  "nature",
  "trump",
  "money",
  "technology",
  "israelwar"
];


let currentChannel =
  localStorage.getItem("vop_live_channel") || "israel";

if(!LIVE_CHANNELS[currentChannel]){
  currentChannel = "israel";
}

let sourceIndex = 0;
let playing = true;
let started = false;


/* ============================================================
   CREATE YOUTUBE URL
   ============================================================ */

function youtubeUrl(videoId){

  const origin =
    location.origin &&
    location.origin.startsWith("http")
    ? location.origin
    : "";

  let url =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId) +
    "?autoplay=1" +
    "&playsinline=1" +
    "&controls=1" +
    "&rel=0" +
    "&modestbranding=1" +
    "&enablejsapi=1";

  if(origin){
    url += "&origin=" + encodeURIComponent(origin);
  }

  return url;
}


/* ============================================================
   BUTTON HIGHLIGHT
   ============================================================ */

function updateButtons(){

  document.querySelectorAll(".live-channel-btn")
  .forEach(function(btn){

    btn.classList.toggle(
      "active",
      btn.dataset.liveChannel === currentChannel
    );

  });

}


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(text){

  if(message){
    message.textContent = text;
  }

}


function setBadge(text,type){

  if(!liveBadge) return;

  liveBadge.textContent = text;

  if(type === "live"){
    liveBadge.style.background = "#087247";
  }

  else if(type === "loading"){
    liveBadge.style.background = "#a36a00";
  }

  else{
    liveBadge.style.background = "#96303c";
  }

}


/* ============================================================
   LOAD VIDEO
   ============================================================ */

function loadCurrentSource(){

  const channel = LIVE_CHANNELS[currentChannel];

  updateButtons();

  localStorage.setItem(
    "vop_live_channel",
    currentChannel
  );

  if(!channel.sources.length){

    player.src = "about:blank";

    sourceLabel.textContent =
      "No source programmed.";

    setStatus(
      "No video source is available for this channel."
    );

    setBadge("NO SOURCE","error");

    return;
  }


  if(sourceIndex >= channel.sources.length){
    sourceIndex = 0;
  }

  if(sourceIndex < 0){
    sourceIndex =
      channel.sources.length - 1;
  }


  const source =
    channel.sources[sourceIndex];


  currentLabel.textContent =
    "Channel " +
    channel.number +
    " — " +
    channel.title;


  sourceLabel.textContent =
    source.name +
    " • Source " +
    (sourceIndex + 1) +
    " of " +
    channel.sources.length;


  setBadge("CONNECTING","loading");

  setStatus(
    "Loading " +
    source.name +
    "..."
  );


  /*
     Reload the iframe completely.
     This is much more reliable on iPhone.
  */

  player.src = "about:blank";


  setTimeout(function(){

    player.src =
      youtubeUrl(source.videoId);

  },150);


  /*
     IMPORTANT:
     We DO NOT automatically reject the stream
     after 15 seconds anymore.

     Some YouTube livestreams take longer
     on Safari / iPhone.
  */

  setTimeout(function(){

    setBadge("● PLAYING","live");

    setStatus(
      source.name +
      " — If this source is unavailable, tap Next Source."
    );

  },2500);

}


/* ============================================================
   CHANGE SOURCE
   ============================================================ */

function nextSource(){

  const channel =
    LIVE_CHANNELS[currentChannel];

  if(!channel.sources.length) return;

  sourceIndex++;

  if(sourceIndex >= channel.sources.length){
    sourceIndex = 0;
  }

  loadCurrentSource();

}


function previousSource(){

  const channel =
    LIVE_CHANNELS[currentChannel];

  if(!channel.sources.length) return;

  sourceIndex--;

  if(sourceIndex < 0){
    sourceIndex =
      channel.sources.length - 1;
  }

  loadCurrentSource();

}


/* ============================================================
   CHANGE CHANNEL
   ============================================================ */

function changeChannel(direction){

  let index =
    CHANNEL_ORDER.indexOf(currentChannel);

  if(index < 0){
    index = 0;
  }

  index =
    (
      index +
      direction +
      CHANNEL_ORDER.length
    ) %
    CHANNEL_ORDER.length;


  currentChannel =
    CHANNEL_ORDER[index];

  sourceIndex = 0;

  started = true;

  overlay.classList.add("hidden");

  loadCurrentSource();

}


/* ============================================================
   PLAY / PAUSE
   ============================================================ */

function youtubeCommand(command){

  try{

    player.contentWindow.postMessage(
      JSON.stringify({
        event:"command",
        func:command,
        args:[]
      }),
      "*"
    );

  }catch(error){}

}


function play(){

  playing = true;

  youtubeCommand("playVideo");

  playPauseBtn.textContent =
    "⏸ Pause";

}


function pause(){

  playing = false;

  youtubeCommand("pauseVideo");

  playPauseBtn.textContent =
    "▶ Play";

}


/* ============================================================
   CHANNEL BUTTONS
   ============================================================ */

document.querySelectorAll(".live-channel-btn")
.forEach(function(btn){

  btn.addEventListener(
    "click",
    function(){

      started = true;

      overlay.classList.add("hidden");

      currentChannel =
        btn.dataset.liveChannel;

      sourceIndex = 0;

      loadCurrentSource();

    }
  );

});


/* ============================================================
   START OVERLAY
   ============================================================ */

overlay.addEventListener(
  "click",
  function(){

    started = true;

    overlay.classList.add("hidden");

    loadCurrentSource();

  }
);


/* ============================================================
   CONTROL BUTTONS
   ============================================================ */

nextChannelBtn.addEventListener(
  "click",
  function(){

    changeChannel(1);

  }
);


previousChannelBtn.addEventListener(
  "click",
  function(){

    changeChannel(-1);

  }
);


nextSourceBtn.addEventListener(
  "click",
  function(){

    nextSource();

  }
);


previousSourceBtn.addEventListener(
  "click",
  function(){

    previousSource();

  }
);


playPauseBtn.addEventListener(
  "click",
  function(){

    if(playing){
      pause();
    }else{
      play();
    }

  }
);


reloadBtn.addEventListener(
  "click",
  function(){

    loadCurrentSource();

  }
);


/* ============================================================
   FULL SCREEN
   ============================================================ */

fullscreenBtn.addEventListener(
  "click",
  function(){

    const container =
      document.querySelector(
        ".live-tv-player"
      );

    if(
      container &&
      container.requestFullscreen
    ){

      container.requestFullscreen();

    }

    else if(
      player &&
      player.webkitEnterFullscreen
    ){

      player.webkitEnterFullscreen();

    }

  }
);


/* ============================================================
   INITIAL DISPLAY
   ============================================================ */

updateButtons();


const startingChannel =
  LIVE_CHANNELS[currentChannel];


currentLabel.textContent =
  "Channel " +
  startingChannel.number +
  " — " +
  startingChannel.title;


sourceLabel.textContent =
  "Tap ▶ to start Voice of Peace Live TV.";


overlayTitle.textContent =
  "▶ Start " +
  startingChannel.title;
