<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Voice of Peace - Register</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0c4f7e 0,#062c4f 35%,#02182e 70%,#010b15 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:560px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo h1{
  margin:0;
  font-size:34px;
  letter-spacing:2px;
}

.logo p{
  margin:8px 0 0;
  color:#4bd0ff;
}

h2{
  text-align:center;
  margin:15px 0;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:4px;
  color:#c9e8ff;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  margin:4px 0;
  border-radius:12px;
  border:1px solid #2b6c99;
  background:#031b30;
  color:white;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#4bd0ff;
  box-shadow:0 0 0 2px rgba(75,208,255,.15);
}

button{
  width:100%;
  padding:15px;
  margin-top:18px;
  border-radius:12px;
  border:0;
  background:#13b868;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  margin-top:18px;
  text-decoration:none;
}

.link:hover{
  text-decoration:underline;
}

.msg{
  min-height:28px;
  text-align:center;
  margin:12px 0;
  color:#ffd34f;
  font-weight:bold;
  line-height:1.4;
}

.success{
  color:#4cff91;
}

.error{
  color:#ff8080;
}

.small{
  text-align:center;
  font-size:12px;
  color:#9ec7df;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="logo">
      <h1>VOICE OF PEACE</h1>
      <p>By Emmanuel &amp; Camili Hileah</p>
    </div>

    <h2>Create Your Account</h2>

    <div id="msg" class="msg"></div>

    <label for="name">Full Name</label>
    <input
      id="name"
      type="text"
      placeholder="Full name"
      autocomplete="name"
    >

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <label for="phone">Phone</label>
    <input
      id="phone"
      type="tel"
      placeholder="Phone number"
      autocomplete="tel"
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Create password"
      autocomplete="new-password"
    >

    <label for="confirmPassword">Confirm Password</label>
    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm password"
      autocomplete="new-password"
    >

    <button id="registerBtn" type="button">
      REGISTER
    </button>

    <a
      class="link"
      href="login.html"
    >
      Already registered? Login
    </a>

    <div class="small">
      Registration requires email confirmation.
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE SETTINGS
========================================================= */

const SUPABASE_URL =
  "https://dpejswtreoqzmrlcnfde.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_92C4dFnhmFBCsasew_6WhQ_InvX4yDX";


/* =========================================================
   IMPORTANT PUBLIC URLs
========================================================= */

const BASE_URL =
  "https://mano34911.github.io/Voice-of-Peace/";

const LOGIN_URL =
  BASE_URL + "login.html";


/* =========================================================
   CREATE SUPABASE CLIENT
========================================================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   PAGE ELEMENTS
========================================================= */

const registerBtn =
  document.getElementById("registerBtn");

const msg =
  document.getElementById("msg");


function showMessage(text,type=""){
  msg.textContent = text;
  msg.className = "msg";

  if(type){
    msg.classList.add(type);
  }
}


/* =========================================================
   REGISTER
========================================================= */

registerBtn.addEventListener("click",registerUser);


async function registerUser(){

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value
      .trim()
      .toLowerCase();

  const phone =
    document.getElementById("phone").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  showMessage("");


  if(!name){
    showMessage(
      "Please enter your full name.",
      "error"
    );
    return;
  }


  if(!email){
    showMessage(
      "Please enter your email.",
      "error"
    );
    return;
  }


  if(!password){
    showMessage(
      "Please enter a password.",
      "error"
    );
    return;
  }


  if(password.length < 6){
    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );
    return;
  }


  if(password !== confirmPassword){
    showMessage(
      "Passwords do not match.",
      "error"
    );
    return;
  }


  registerBtn.disabled = true;
  registerBtn.textContent = "CREATING ACCOUNT...";

  showMessage(
    "Creating your Voice of Peace account..."
  );


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options:{

          /*
          THIS FIXES THE LOCALHOST PROBLEM
          */

          emailRedirectTo: LOGIN_URL,

          data:{
            full_name:name,
            phone:phone,
            role:"member"
          }

        }

      });


    if(error){
      throw error;
    }


    console.log(
      "Registration result:",
      data
    );


    /*
    If email confirmation is enabled,
    session will normally be null until
    the user confirms the email.
    */

    if(
      data.user &&
      !data.session
    ){

      showMessage(
        "Registration successful! Check your email and tap the confirmation link. After confirmation you will return to the Voice of Peace login page.",
        "success"
      );

      registerBtn.textContent =
        "CHECK YOUR EMAIL";

      return;
    }


    /*
    If Supabase email confirmation is disabled
    and the user receives a session immediately.
    */

    if(data.session){

      showMessage(
        "Account created successfully. Opening login...",
        "success"
      );

      setTimeout(function(){
        window.location.href = LOGIN_URL;
      },1500);

      return;
    }


    showMessage(
      "Account created. Check your email.",
      "success"
    );


  }

  catch(error){

    console.error(error);

    showMessage(
      error.message ||
      "Registration failed. Please try again.",
      "error"
    );

    registerBtn.disabled = false;

    registerBtn.textContent =
      "REGISTER";
  }

}


/* =========================================================
   ALLOW ENTER KEY
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      registerUser();
    }

  }
);

</script>

</body>
</html>
