<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Voice of Peace - Register</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0c4f7e 0,#062c4f 35%,#02182e 70%,#010b15 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:560px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo h1{
  margin:0;
  font-size:34px;
  letter-spacing:2px;
}

.logo p{
  margin:8px 0 0;
  color:#4bd0ff;
}

h2{
  text-align:center;
  margin:15px 0;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:4px;
  color:#c9e8ff;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  margin:4px 0;
  border-radius:12px;
  border:1px solid #2b6c99;
  background:#031b30;
  color:white;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#4bd0ff;
  box-shadow:0 0 0 2px rgba(75,208,255,.15);
}

button{
  width:100%;
  padding:15px;
  margin-top:18px;
  border-radius:12px;
  border:0;
  background:#13b868;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  margin-top:18px;
  text-decoration:none;
}

.msg{
  min-height:28px;
  text-align:center;
  margin:12px 0;
  color:#ffd34f;
  font-weight:bold;
}

.success{
  color:#4cff91;
}

.error{
  color:#ff8080;
}

.small{
  text-align:center;
  font-size:12px;
  color:#9ec7df;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="logo">
      <h1>VOICE OF PEACE</h1>
      <p>By Emmanuel &amp; Camili Hileah</p>
    </div>

    <h2>Create Your Account</h2>

    <div id="msg" class="msg"></div>

    <label for="name">Full Name</label>
    <input
      id="name"
      type="text"
      placeholder="Full name"
      autocomplete="name"
    >

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <label for="phone">Phone</label>
    <input
      id="phone"
      type="tel"
      placeholder="Phone number"
      autocomplete="tel"
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Create password"
    >

    <label for="confirmPassword">Confirm Password</label>
    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm password"
    >

    <button id="registerBtn" type="button">
      REGISTER
    </button>

    <a class="link" href="login.html">
      Already registered? Login
    </a>

    <a class="link" href="index.html">
      Continue to Voice of Peace
    </a>

    <div class="small">
      Temporary open registration enabled.
    </div>

  </div>

</div>

<script>

const registerBtn =
  document.getElementById("registerBtn");

const msg =
  document.getElementById("msg");

function showMessage(text,type=""){
  msg.textContent = text;
  msg.className = "msg";

  if(type){
    msg.classList.add(type);
  }
}

registerBtn.addEventListener(
  "click",
  registerUser
);

function registerUser(){

  const name =
    document.getElementById("name")
    .value.trim();

  const email =
    document.getElementById("email")
    .value.trim()
    .toLowerCase();

  const phone =
    document.getElementById("phone")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const confirmPassword =
    document.getElementById("confirmPassword")
    .value;

  if(!name){
    showMessage(
      "Please enter your full name.",
      "error"
    );
    return;
  }

  if(!email){
    showMessage(
      "Please enter your email.",
      "error"
    );
    return;
  }

  if(password !== confirmPassword){
    showMessage(
      "Passwords do not match.",
      "error"
    );
    return;
  }

  const member = {
    id: Date.now(),
    name: name,
    email: email,
    phone: phone,
    createdAt: new Date().toISOString()
  };

  let members = [];

  try{
    members =
      JSON.parse(
        localStorage.getItem(
          "voiceOfPeaceMembers"
        )
      ) || [];
  }
  catch(e){
    members = [];
  }

  const exists =
    members.some(function(existing){

      return String(existing.email)
        .toLowerCase() === email;

    });

  if(!exists){

    members.push(member);

    localStorage.setItem(
      "voiceOfPeaceMembers",
      JSON.stringify(members)
    );
  }

  localStorage.setItem(
    "voiceOfPeaceAccess",
    "granted"
  );

  localStorage.setItem(
    "voiceOfPeaceCurrentUser",
    email
  );

  showMessage(
    "Account created. Opening Voice of Peace...",
    "success"
  );

  setTimeout(function(){

    window.location.href =
      "index.html";

  },700);
}

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      registerUser();
    }

  }
);

</script>

</body>
</html>
