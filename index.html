<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#01162b">

<title>Voice of Peace</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,
        #145584 0%,
        #062f54 27%,
        #01182d 62%,
        #000d19 100%);
}

/* ==============================
   HEADER
============================== */

.header{
    padding:25px 24px 22px;
    border-bottom:3px solid #246894;
    background:rgba(0,26,51,.70);
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.small-title{
    color:#55ceff;
    letter-spacing:8px;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.main-title{
    font-size:37px;
    line-height:1;
    font-weight:900;
    margin:0;
}

.byline{
    margin-top:8px;
    color:#ffd64d;
    font-size:18px;
    font-weight:bold;
}

.live-pill{
    background:#0ac369;
    border-radius:40px;
    padding:17px 27px;
    font-size:18px;
    font-weight:900;
    white-space:nowrap;
}

/* ==============================
   MAIN TV BOX
============================== */

.wrapper{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:38px 15px 70px;
}

.tv-card{
    border:2px solid #225a83;
    border-radius:28px;
    padding:30px;
    background:
      linear-gradient(
      135deg,
      rgba(6,57,94,.92),
      rgba(1,29,52,.96)
      );

    box-shadow:
      0 10px 35px rgba(0,0,0,.35),
      inset 0 0 40px rgba(18,117,177,.08);
}

/* ==============================
   TITLE ROW
============================== */

.tv-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:27px;
}

.tv-title{
    font-size:38px;
    line-height:1.15;
    font-weight:900;
}

.status{
    min-width:135px;
    text-align:center;
    padding:15px 18px;
    border-radius:35px;
    background:#a62f43;
    font-weight:900;
    font-size:16px;
}

.status.live{
    background:#09b95f;
}

.status.loading{
    background:#d99a12;
}

/* ==============================
   CHANNEL BUTTONS
============================== */

.channels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.channel{
    min-height:119px;
    border:2px solid #337ea9;
    border-radius:20px;

    background:
      linear-gradient(
      135deg,
      #07517e,
      #062844
      );

    color:white;
    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:
      transform .15s ease,
      border-color .15s ease,
      box-shadow .15s ease;

    padding:15px;
}

.channel:active{
    transform:scale(.97);
}

.channel.active{
    border:4px solid #ffd84c;
    box-shadow:
      0 0 0 5px rgba(255,216,76,.25),
      0 0 20px rgba(255,216,76,.25);
}

.channel-number{
    color:#ffd84c;
    font-size:17px;
    font-weight:900;
    margin-bottom:8px;
}

.channel-name{
    font-size:20px;
    font-weight:900;
    text-align:center;
}

/* ==============================
   VIDEO PLAYER
============================== */

.player-wrap{
    width:100%;
    margin-top:28px;

    background:#000;

    border:2px solid #3181ad;
    border-radius:22px;
    overflow:hidden;

    aspect-ratio:16 / 9;

    position:relative;
}

#youtubePlayer,
#htmlVideo{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    border:0;
    background:#000;
}

#htmlVideo{
    display:none;
}

.player-message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:#a8c4d8;
    font-size:20px;
    font-weight:bold;
    background:#000;
    z-index:3;
}

/* ==============================
   NOW PLAYING
============================== */

.now-playing{
    margin-top:16px;
    text-align:center;
    font-size:16px;
    color:#b9d7e9;
}

.now-playing strong{
    color:#ffd84c;
}

/* ==============================
   CONTROL BUTTONS
============================== */

.controls{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:18px;
}

.control-btn{
    border:none;
    color:white;
    background:#126aa2;
    padding:12px 20px;
    border-radius:30px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.control-btn:hover{
    background:#1784c7;
}

.control-btn.red{
    background:#a92e40;
}

/* ==============================
   FOOTER
============================== */

.footer{
    text-align:center;
    color:#759bb4;
    font-size:13px;
    padding:35px 15px;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:650px){

    .header{
        padding:22px 24px 20px;
    }

    .small-title{
        font-size:12px;
        letter-spacing:7px;
    }

    .main-title{
        font-size:34px;
    }

    .byline{
        font-size:17px;
    }

    .live-pill{
        padding:15px 22px;
        font-size:16px;
    }

    .wrapper{
        padding:37px 14px 60px;
    }

    .tv-card{
        padding:30px 18px;
        border-radius:27px;
    }

    .tv-title{
        font-size:31px;
    }

    .status{
        min-width:115px;
        font-size:14px;
        padding:13px 15px;
    }

    .channel{
        min-height:118px;
        padding:12px 8px;
    }

    .channel-number{
        font-size:16px;
    }

    .channel-name{
        font-size:19px;
    }

}

/* SMALL PHONE */

@media(max-width:420px){

    .header-inner{
        align-items:center;
    }

    .main-title{
        font-size:29px;
    }

    .small-title{
        font-size:10px;
        letter-spacing:5px;
    }

    .byline{
        font-size:15px;
    }

    .live-pill{
        padding:13px 17px;
    }

    .tv-title{
        font-size:27px;
    }

    .channel-name{
        font-size:17px;
    }

}

</style>
</head>

<body>

<!-- =====================================

===================================== -->

<header class="header">

<div>

<!-- =====================================
     PLAYER
===================================== -->

<div class="player-wrap">

id="playerMessage"

Choose a channel above to begin watching.

</div>

<iframe
id="youtubePlayer"
src=""
allow="
accelerometer;
autoplay;
clipboard-write;
encrypted-media;

"

■ Stop TV

</section>

Voice of Peace<br>
By Emmanuel &amp; Camili Hileah

<script>

/*
==========================================================
VOICE OF PEACE CHANNEL LIST
==========================================================

IMPORTANT:

Each channel needs an EMBEDDABLE video source.

YouTube formats supported by this page:

https://www.youtube.com/watch?v=VIDEO_ID

https://youtu.be/VIDEO_ID

https://www.youtube.com/embed/VIDEO_ID

You can also use an MP4 file:

https://example.com/movie.mp4

Or an HLS .m3u8 stream if the browser supports it.

==========================================================
*/


const channels = {


1:{
    title:"Israel News Live",

    /*
    Replace this with your Israel live YouTube video.
    */
    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


2:{
    title:"U.S. News Live",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


3:{
    title:"Comedy TV",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


4:{
    title:"Comedy Movies",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


5:{
    title:"Shorts TV",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


6:{
    title:"Travel TV",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


7:{
    title:"Animal TV",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


8:{
    title:"Nature & Ocean",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


9:{
    title:"Trump News",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


10:{
    title:"Make Money",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


11:{
    title:"Today's Technology",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
},


12:{
    title:"Israel War & Security",

    url:"https://www.youtube.com/watch?v=M7lc1UVf-VE"
}

};


/*
==========================================================
DO NOT CHANGE ANYTHING BELOW HERE
==========================================================
*/

let currentChannel = null;


/* GET YOUTUBE VIDEO ID */

function getYouTubeID(url){

    if(!url) return null;

    let match;

    match =
    url.match(
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?\/]+)/i
    );

    if(match && match[1]){
        return match[1];
    }

    return null;
}


/* CLEAR PLAYER */

function clearPlayers(){

    const iframe =
    document.getElementById("youtubePlayer");

    const video =
    document.getElementById("htmlVideo");

    iframe.src = "";

    video.pause();

    video.removeAttribute("src");

    video.load();

    iframe.style.display="block";

    video.style.display="none";

}


/* PLAY CHANNEL */

function playChannel(number,button){

    const channel =
    channels[number];

    if(!channel){
        showError("Channel not found.");
        return;
    }

    currentChannel =
    number;


    /* Highlight selected button */

    document
    .querySelectorAll(".channel")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }


    /* Update title */

    document.getElementById("tvTitle")
    .textContent =
    channel.title;


    document.getElementById("nowPlaying")
    .textContent =
    channel.title;


    const status =
    document.getElementById("sourceStatus");

    status.innerHTML =
    "LOADING";

    status.className =
    "status loading";


    const message =
    document.getElementById("playerMessage");

    message.style.display =
    "none";


    clearPlayers();


    const url =
    channel.url;


    if(!url){

        showError(
        "No source has been assigned to this channel."
        );

        return;
    }


    /*
    ==========================
    YOUTUBE
    ==========================
    */

    const youtubeID =
    getYouTubeID(url);

    if(youtubeID){

        const iframe =
        document.getElementById(
        "youtubePlayer"
        );

        const origin =
        encodeURIComponent(
        window.location.origin
        );


        iframe.src =
        "https://www.youtube.com/embed/"
        + youtubeID
        + "?autoplay=1"
        + "&playsinline=1"
        + "&rel=0"
        + "&modestbranding=1"
        + "&enablejsapi=1"
        + "&origin="
        + origin;


        iframe.style.display =
        "block";


        setTimeout(()=>{

            status.innerHTML =
            "LIVE";

            status.className =
            "status live";

        },1000);


        return;
    }


    /*
    ==========================
    MP4 / VIDEO
    ==========================
    */

    if(
       url.includes(".mp4") ||
       url.includes(".webm") ||
       url.includes(".mov")
    ){

        const iframe =
        document.getElementById(
        "youtubePlayer"
        );

        iframe.style.display =
        "none";


        const video =
        document.getElementById(
        "htmlVideo"
        );

        video.style.display =
        "block";

        video.src =
        url;

        video.play()
        .catch(()=>{});


        status.innerHTML =
        "LIVE";

        status.className =
        "status live";

        return;
    }


    /*
    ==========================
    OTHER EMBEDDABLE URL
    ==========================
    */

    const iframe =
    document.getElementById(
    "youtubePlayer"
    );

    iframe.style.display =
    "block";

    iframe.src =
    url;


    setTimeout(()=>{

        status.innerHTML =
        "LIVE";

        status.className =
        "status live";

    },1000);

}


/* ERROR MESSAGE */

function showError(text){

    clearPlayers();

    const status =
    document.getElementById(
    "sourceStatus"
    );

    status.innerHTML =
    "NO<br>SOURCE";

    status.className =
    "status";


    const message =
    document.getElementById(
    "playerMessage"
    );

    message.textContent =
    text;

    message.style.display =
    "flex";

}


/* STOP TV */

function stopTV(){

    currentChannel =
    null;

    clearPlayers();


    document
    .querySelectorAll(".channel")
    .forEach(btn=>{
        btn.classList.remove("active");
    });


    document.getElementById(
    "tvTitle"
    ).textContent =
    "Voice of Peace Live TV";


    document.getElementById(
    "nowPlaying"
    ).textContent =
    "TV stopped";


    const status =
    document.getElementById(
    "sourceStatus"
    );

    status.innerHTML =
    "STOPPED";

    status.className =
    "status";


    const message =
    document.getElementById(
    "playerMessage"
    );

    message.textContent =
    "Select a channel to continue watching.";

    message.style.display =
    "flex";

}


/* RELOAD CURRENT CHANNEL */

function reloadChannel(){

    if(!currentChannel){

        showError(
        "Select a channel first."
        );

        return;
    }


    const button =
    document.querySelector(
    '[data-channel="' +
    currentChannel +
    '"]'
    );


    playChannel(
    currentChannel,
    button
    );

}


/*
==========================================================
AUTO START CHANNEL 1
==========================================================
*/

window.addEventListener(
"load",
function(){

    const firstButton =
    document.querySelector(
    '[data-channel="1"]'
    );

    playChannel(
    1,
    firstButton
    );

});

</script>

</body>
