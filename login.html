<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice of Peace - Login</title><style>body{margin:0;background:#02182e;color:#fff;font-family:Arial} .wrap{max-width:560px;margin:40px auto;padding:20px}.card{background:#062746;border:1px solid #245d88;border-radius:22px;padding:24px}h1{text-align:center}input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2b6c99;font-size:16px;box-sizing:border-box}button{background:#13b868;color:white;font-weight:800;border:0}.link{display:block;text-align:center;color:#4bd0ff;margin-top:14px}.msg{min-height:24px;color:#ffd34f;text-align:center}</style></head><body><div class="wrap"><div class="card"><h1>VOICE OF PEACE</h1><h2>Member Login</h2><div id="msg" class="msg"></div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">LOGIN</button><a class="link" href="register.html">New member? Register here</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://oyeeeooymrzemxfrvcon.supabase.co';
const SUPABASE_KEY='sb_publishable_F5jtSPiZ-BCxTiPT4XCW7w_LVJcOJ8j';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=t=>document.getElementById('msg').textContent=t;
async function routeUser(user){
 const {data,error}=await sb.from('voice_members').select('*').eq('user_id',user.id).maybeSingle();
 if(error){msg(error.message);return}
 if(!data){msg('Your member record is not ready yet.');return}
 if(data.member_status==='suspended'){await sb.auth.signOut();msg('Your membership is suspended. Contact the administrator.');return}
 if(data.member_status==='deleted'){await sb.auth.signOut();msg('This membership is no longer active.');return}
 if(data.member_status!=='approved'){msg('Your registration is waiting for administrator approval.');return}
 if(data.is_admin===true || data.payment_status==='active') location.href='music.html';
 else location.href='payment.html';
}
document.getElementById('loginBtn').onclick=async()=>{
 msg('Signing in...');
 const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){msg(error.message);return}
 await routeUser(data.user);
};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session?.user) await routeUser(session.user)})();
</script></body></html>
