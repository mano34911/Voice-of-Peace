<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Voice of Peace - Login</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap"><div class="card">
  <div class="logo"><h1>VOICE OF PEACE</h1><p>Member Login</p></div>
  <div id="msg" class="msg"></div>

  <form id="form">
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="submit" type="submit">LOGIN</button>
  </form>

  <a class="link" href="register.html">Create account</a>
  <a class="link" href="forgot-password.html">Forgot password?</a>
  <a class="link" href="admin-login.html">Admin login</a>
  <a class="link" href="index.html">Return to Voice of Peace</a>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const p=new URLSearchParams(location.search);
const msg=document.getElementById("msg");
function show(t,c=""){msg.textContent=t;msg.className="msg "+c;}
const reason=p.get("reason");
if(reason==="pending") show("Your account is waiting for admin approval.","warning");
if(reason==="suspended") show("Your account is suspended. Contact the administrator.","error");
if(reason==="deleted") show("This account is disabled.","error");

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("submit");
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  btn.disabled=true; btn.textContent="SIGNING IN...";
  show("Checking account...","warning");

  try{
    const client=getClient();
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error) throw error;

    const {data:profile,error:pe}=await client.from("profiles").select("*").eq("id",data.user.id).single();
    if(pe) throw pe;

    if(profile.status!=="approved"){
      await client.auth.signOut();
      show(profile.status==="pending" ? "Your email is confirmed, but your account is waiting for admin approval." : "Your account is not allowed to sign in.","error");
      btn.disabled=false; btn.textContent="LOGIN";
      return;
    }

    if(!subscriptionAllowed(profile)){
      await client.auth.signOut();
      window.location.href=cfg("BASE_URL")+cfg("PAYMENT_PAGE");
      return;
    }

    go(cfg("MEMBER_PAGE"));
  }catch(err){
    show(err.message || "Invalid login.","error");
    btn.disabled=false; btn.textContent="LOGIN";
  }
});
</script>
</body></html>
