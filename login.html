<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Voice of Peace - Login</title>

<style>
body{
  margin:0;
  background:#02182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:560px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:24px;
}

h1{
  text-align:center;
}

input,
button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #2b6c99;
  font-size:16px;
  box-sizing:border-box;
}

button{
  background:#13b868;
  color:white;
  font-weight:800;
  border:0;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  margin-top:14px;
}

.msg{
  min-height:24px;
  color:#ffd34f;
  text-align:center;
  padding:5px;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>VOICE OF PEACE</h1>
    <h2>Member Login</h2>

    <div id="msg" class="msg"></div>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      LOGIN
    </button>

    <a class="link" href="register.html">
      New member? Register here
    </a>

  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://oyeeeooymrzemxfrvcon.supabase.co';

const SUPABASE_KEY =
'sb_publishable_F5jtSPiZ-BCxTiPT4XCW7w_LVJcOJ8j';

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ===============================
// PAGE LOCATIONS
// ===============================

const ADMIN_PAGE = 'admin.html';
const MUSIC_PAGE = 'music.html';
const PAYMENT_PAGE = 'payment.html';


// ===============================
// ELEMENTS
// ===============================

const emailInput =
document.getElementById('email');

const passwordInput =
document.getElementById('password');

const loginBtn =
document.getElementById('loginBtn');

const messageBox =
document.getElementById('msg');


function msg(text){
  messageBox.textContent = text || '';
}


// ===============================
// ROUTE LOGGED IN USER
// ===============================

async function routeUser(user){

  msg('Checking membership...');

  const {
    data: member,
    error
  } = await sb
    .from('voice_members')
    .select('*')
    .eq('user_id', user.id)
    .maybeSingle();


  if(error){

    console.error(error);

    msg(
      'Membership database error: ' +
      error.message
    );

    return;
  }


  // -----------------------------
  // NO MEMBER RECORD
  // -----------------------------

  if(!member){

    await sb.auth.signOut();

    msg(
      'Your login exists, but your member record is not connected yet.'
    );

    return;
  }


  // -----------------------------
  // BLOCK DELETED
  // -----------------------------

  if(member.member_status === 'deleted'){

    await sb.auth.signOut();

    msg(
      'This membership is no longer active.'
    );

    return;
  }


  // -----------------------------
  // BLOCK SUSPENDED
  // -----------------------------

  if(member.member_status === 'suspended'){

    await sb.auth.signOut();

    msg(
      'Your membership is suspended. Contact the administrator.'
    );

    return;
  }


  // ===============================
  // ADMIN LOGIN
  // ===============================

  if(member.is_admin === true){

    msg('Administrator login successful...');

    window.location.replace(
      ADMIN_PAGE
    );

    return;
  }


  // -----------------------------
  // WAITING FOR APPROVAL
  // -----------------------------

  if(member.member_status !== 'approved'){

    await sb.auth.signOut();

    msg(
      'Your registration is waiting for administrator approval.'
    );

    return;
  }


  // -----------------------------
  // ACTIVE PAID MEMBER
  // -----------------------------

  if(member.payment_status === 'active'){

    msg('Login successful...');

    window.location.replace(
      MUSIC_PAGE
    );

    return;
  }


  // -----------------------------
  // APPROVED BUT PAYMENT REQUIRED
  // -----------------------------

  msg('Membership payment required...');

  window.location.replace(
    PAYMENT_PAGE
  );
}


// ===============================
// LOGIN
// ===============================

async function login(){

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;


  if(!email){

    msg('Please enter your email.');

    return;
  }


  if(!password){

    msg('Please enter your password.');

    return;
  }


  loginBtn.disabled = true;

  msg('Signing in...');


  try{

    const {
      data,
      error
    } = await sb.auth.signInWithPassword({

      email: email,

      password: password

    });


    if(error){

      console.error(error);

      msg(error.message);

      return;
    }


    if(!data.user){

      msg('Login failed.');

      return;
    }


    await routeUser(
      data.user
    );


  }catch(error){

    console.error(error);

    msg(
      'Login error. Please try again.'
    );


  }finally{

    loginBtn.disabled = false;

  }

}


// ===============================
// BUTTON
// ===============================

loginBtn.addEventListener(
  'click',
  login
);


// ===============================
// PRESS ENTER TO LOGIN
// ===============================

passwordInput.addEventListener(
  'keydown',
  function(event){

    if(event.key === 'Enter'){

      login();

    }

  }
);


// ===============================
// EXISTING SESSION
// ===============================

(async function(){

  const {
    data: { session }
  } = await sb.auth.getSession();


  if(session?.user){

    await routeUser(
      session.user
    );

  }

})();

</script>

</body>
</html>
