<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice of Peace - Register</title><style>body{margin:0;background:#02182e;color:#fff;font-family:Arial}.wrap{max-width:560px;margin:30px auto;padding:20px}.card{background:#062746;border:1px solid #245d88;border-radius:22px;padding:24px}input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #2b6c99;font-size:16px;box-sizing:border-box}button{background:#13b868;color:white;font-weight:800;border:0}.link{display:block;text-align:center;color:#4bd0ff;margin-top:14px}.msg{color:#ffd34f;text-align:center;min-height:24px}</style></head><body><div class="wrap"><div class="card"><h1>VOICE OF PEACE</h1><h2>Register</h2><div id="msg" class="msg"></div><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Create password (minimum 6 characters)"><button id="registerBtn">REGISTER</button><a class="link" href="login.html">Already registered? Login</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://oyeeeooymrzemxfrvcon.supabase.co','sb_publishable_F5jtSPiZ-BCxTiPT4XCW7w_LVJcOJ8j');
const msg=t=>document.getElementById('msg').textContent=t;
document.getElementById('registerBtn').onclick=async()=>{
 const full_name=name.value.trim(), ph=phone.value.trim(), em=email.value.trim(), pw=password.value;
 if(!full_name||!em||pw.length<6){msg('Enter your name, email and a password of at least 6 characters.');return}
 msg('Creating account...');
 const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name,phone:ph}}});
 if(error){msg(error.message);return}
 msg('Registration received. An administrator must approve your membership before payment and full access.');
};
</script></body></html>
