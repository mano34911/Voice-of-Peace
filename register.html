<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Voice of Peace - Register</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at top,
      #0c4f7e 0,
      #062c4f 35%,
      #02182e 70%,
      #010b15 100%
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

.wrap{
  max-width:560px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#062746;

  border:1px solid #245d88;

  border-radius:22px;

  padding:24px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo h1{
  margin:0;

  font-size:
    clamp(28px,7vw,40px);

  letter-spacing:2px;
}

.logo p{
  margin:8px 0 0;

  color:#4bd0ff;
}

h2{
  text-align:center;

  margin:15px 0 20px;
}

label{
  display:block;

  margin-top:15px;

  margin-bottom:6px;

  color:#c9e8ff;

  font-size:15px;

  font-weight:bold;
}

input{
  width:100%;

  padding:15px;

  margin:4px 0;

  border-radius:12px;

  border:
    1px solid #2b6c99;

  background:#fff;

  color:#111;

  font-size:17px;
}

input:focus{
  outline:none;

  border-color:#4bd0ff;

  box-shadow:
    0 0 0 2px
    rgba(75,208,255,.15);
}

.passwordWrap{
  position:relative;
}

.passwordWrap input{
  padding-right:85px;
}

.showPassword{
  position:absolute;

  right:8px;
  top:50%;

  transform:
    translateY(-50%);

  width:auto;

  margin:0;

  padding:8px 10px;

  border-radius:8px;

  background:#174d72;

  color:#fff;

  font-size:13px;

  font-weight:bold;

  cursor:pointer;
}

button{
  width:100%;

  padding:15px;

  margin-top:20px;

  border-radius:12px;

  border:0;

  background:#13b868;

  color:white;

  font-size:18px;

  font-weight:800;

  cursor:pointer;
}

button:disabled{
  opacity:.55;

  cursor:not-allowed;
}

.link{
  display:block;

  text-align:center;

  color:#4bd0ff;

  margin-top:18px;

  text-decoration:none;

  font-size:17px;
}

.link:hover{
  text-decoration:underline;
}

.msg{
  min-height:30px;

  text-align:center;

  margin:12px 0;

  color:#ffd34f;

  font-weight:bold;

  line-height:1.4;
}

.success{
  color:#4cff91;
}

.error{
  color:#ff8080;
}

.small{
  text-align:center;

  font-size:13px;

  color:#9ec7df;

  margin-top:22px;

  line-height:1.5;
}

.matchMessage{
  min-height:22px;

  font-size:13px;

  margin-top:6px;

  text-align:left;
}

.matchOk{
  color:#4cff91;
}

.matchBad{
  color:#ff8080;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="logo">

<h1>
VOICE OF PEACE
</h1>

<p>
By Emmanuel &amp; Camili Hileah
</p>

</div>


<h2>
Create Member Account
</h2>


<div
  id="msg"
  class="msg"
></div>


<form
  id="registerForm"
  autocomplete="on"
>


<label for="name">
Full Name
</label>

<input
  id="name"
  name="name"
  type="text"
  placeholder="Full name"
  autocomplete="name"
  required
>


<label for="email">
Email
</label>

<input
  id="email"
  name="email"
  type="email"
  placeholder="Email address"
  autocomplete="email"
  autocapitalize="none"
  spellcheck="false"
  required
>


<label for="phone">
Phone
</label>

<input
  id="phone"
  name="phone"
  type="tel"
  placeholder="Phone number"
  autocomplete="tel"
>


<label for="password">
Password
</label>

<div class="passwordWrap">

<input
  id="password"
  name="password"
  type="password"
  placeholder="Create password"
  autocomplete="new-password"
  autocapitalize="none"
  spellcheck="false"
  minlength="6"
  required
>

<button
  id="showPassword1"
  class="showPassword"
  type="button"
>
SHOW
</button>

</div>


<label for="confirmPassword">
Confirm Password
</label>

<div class="passwordWrap">

<input
  id="confirmPassword"
  name="confirmPassword"
  type="password"
  placeholder="Confirm password"
  autocomplete="new-password"
  autocapitalize="none"
  spellcheck="false"
  minlength="6"
  required
>

<button
  id="showPassword2"
  class="showPassword"
  type="button"
>
SHOW
</button>

</div>


<div
  id="matchMessage"
  class="matchMessage"
></div>


<button
  id="registerBtn"
  type="submit"
>
REGISTER
</button>

</form>


<a
  class="link"
  href="login.html"
>
Already registered? Login
</a>


<a
  class="link"
  href="index.html"
>
Return to Voice of Peace
</a>


<div class="small">

After registration,
check your email and click
the confirmation link.

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dpejswtreoqzmrlcnfde.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_92C4dFnhmFBCsasew_6WhQ_InvX4yDX";


const BASE_URL =
"https://mano34911.github.io/Voice-of-Peace/";


const LOGIN_URL =
BASE_URL + "login.html";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const form =
document.getElementById(
  "registerForm"
);


const registerBtn =
document.getElementById(
  "registerBtn"
);


const msg =
document.getElementById(
  "msg"
);


const passwordInput =
document.getElementById(
  "password"
);


const confirmInput =
document.getElementById(
  "confirmPassword"
);


const matchMessage =
document.getElementById(
  "matchMessage"
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type=""
){

  msg.textContent =
    text;

  msg.className =
    "msg";

  if(type){

    msg.classList.add(
      type
    );

  }

}


/* =========================================================
   PASSWORD CLEANING
========================================================= */

/*
Removes accidental spaces at
the beginning/end and normalizes
characters copied or entered by
mobile keyboards.
*/

function cleanPassword(value){

  return String(value)
    .normalize("NFKC")
    .trim();

}


/* =========================================================
   LIVE PASSWORD CHECK
========================================================= */

function checkPasswords(){

  const password =
    cleanPassword(
      passwordInput.value
    );


  const confirmPassword =
    cleanPassword(
      confirmInput.value
    );


  matchMessage.className =
    "matchMessage";


  if(
    confirmPassword.length === 0
  ){

    matchMessage.textContent =
      "";

    return;

  }


  if(
    password === confirmPassword
  ){

    matchMessage.textContent =
      "✓ Passwords match";

    matchMessage.classList.add(
      "matchOk"
    );

  }

  else{

    matchMessage.textContent =
      "Passwords do not match yet.";

    matchMessage.classList.add(
      "matchBad"
    );

  }

}


passwordInput.addEventListener(
  "input",
  checkPasswords
);


confirmInput.addEventListener(
  "input",
  checkPasswords
);


/* =========================================================
   SHOW / HIDE PASSWORD
========================================================= */

function setupPasswordToggle(
  buttonId,
  inputId
){

  const button =
    document.getElementById(
      buttonId
    );


  const input =
    document.getElementById(
      inputId
    );


  button.addEventListener(
    "click",
    function(){

      if(
        input.type ===
        "password"
      ){

        input.type =
          "text";

        button.textContent =
          "HIDE";

      }

      else{

        input.type =
          "password";

        button.textContent =
          "SHOW";

      }

    }
  );

}


setupPasswordToggle(
  "showPassword1",
  "password"
);


setupPasswordToggle(
  "showPassword2",
  "confirmPassword"
);


/* =========================================================
   REGISTER
========================================================= */

form.addEventListener(
  "submit",
  registerUser
);


async function registerUser(event){

  event.preventDefault();


  if(registerBtn.disabled){
    return;
  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const password =
    cleanPassword(
      passwordInput.value
    );


  const confirmPassword =
    cleanPassword(
      confirmInput.value
    );


  showMessage("");


  if(!name){

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;

  }


  if(!email){

    showMessage(
      "Please enter your email.",
      "error"
    );

    return;

  }


  if(!password){

    showMessage(
      "Please enter a password.",
      "error"
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;

  }


  if(!confirmPassword){

    showMessage(
      "Please confirm your password.",
      "error"
    );

    return;

  }


  if(
    password !==
    confirmPassword
  ){

    showMessage(
      "Passwords do not match. Tap SHOW on both password boxes and check them.",
      "error"
    );

    return;

  }


  registerBtn.disabled =
    true;


  registerBtn.textContent =
    "CREATING ACCOUNT...";


  showMessage(
    "Creating your Voice of Peace account..."
  );


  try{


    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .signUp({

        email:
          email,

        password:
          password,

        options:{

          emailRedirectTo:
            LOGIN_URL,

          data:{

            full_name:
              name,

            phone:
              phone,

            role:
              "member"

          }

        }

      });


    if(error){

      throw error;

    }


    console.log(
      "Registration result:",
      data
    );


    if(
      data.user &&
      !data.session
    ){

      showMessage(
        "Registration successful! Check your email and tap the confirmation link. After confirmation you will return to the Voice of Peace login page.",
        "success"
      );


      registerBtn.textContent =
        "CHECK YOUR EMAIL";


      return;

    }


    if(data.session){

      showMessage(
        "Account created successfully. Opening login...",
        "success"
      );


      setTimeout(
        function(){

          window.location.href =
            LOGIN_URL;

        },
        1500
      );


      return;

    }


    showMessage(
      "Account created. Check your email.",
      "success"
    );


    registerBtn.textContent =
      "CHECK YOUR EMAIL";

  }


  catch(error){

    console.error(
      error
    );


    showMessage(
      error.message ||
      "Registration failed. Please try again.",
      "error"
    );


    registerBtn.disabled =
      false;


    registerBtn.textContent =
      "REGISTER";

  }

}

</script>

</body>
</html>
