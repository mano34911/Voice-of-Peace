<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Voice of Peace - Register</title>

<style>
body{
  margin:0;
  background:#02182e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:560px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:24px;
}

h1{
  text-align:center;
  margin-top:0;
}

h2{
  text-align:center;
}

input,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #2b6c99;
  font-size:16px;
  box-sizing:border-box;
}

button{
  background:#13b868;
  color:white;
  font-weight:800;
  border:0;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.08);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  margin-top:14px;
  font-size:18px;
  text-decoration:none;
}

.link:hover{
  text-decoration:underline;
}

.msg{
  color:#ffd34f;
  text-align:center;
  min-height:24px;
  margin-bottom:8px;
  line-height:1.4;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>VOICE OF PEACE</h1>
    <h2>Register</h2>

    <div id="msg" class="msg"></div>

    <input
      id="fullName"
      type="text"
      placeholder="Full name"
      autocomplete="name"
    >

    <input
      id="phone"
      type="tel"
      placeholder="Phone"
      autocomplete="tel"
    >

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Create password (minimum 6 characters)"
      autocomplete="new-password"
    >

    <button type="button" id="registerBtn">
      REGISTER
    </button>

    <a class="link" href="login.html">
      Already registered? Login
    </a>

  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  'https://dpejswtreoqzmrlcnfde.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_92C4dFnhmFBCsasew_6WhQ_InvX4yDX';

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const fullNameInput =
  document.getElementById('fullName');

const phoneInput =
  document.getElementById('phone');

const emailInput =
  document.getElementById('email');

const passwordInput =
  document.getElementById('password');

const registerBtn =
  document.getElementById('registerBtn');

const msgBox =
  document.getElementById('msg');


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,color='#ffd34f'){
  msgBox.textContent=text;
  msgBox.style.color=color;
}


/* =========================================================
   EMAIL CHECK
========================================================= */

function validEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}


/* =========================================================
   REGISTER
========================================================= */

registerBtn.addEventListener(
  'click',
  async function(){

    const full_name =
      fullNameInput.value.trim();

    const phone =
      phoneInput.value.trim();

    const email =
      emailInput.value.trim().toLowerCase();

    const password =
      passwordInput.value;


    /* =====================================================
       VALIDATION
    ===================================================== */

    if(!full_name){

      showMessage(
        'Please enter your full name.'
      );

      fullNameInput.focus();

      return;
    }


    if(!email){

      showMessage(
        'Please enter your email.'
      );

      emailInput.focus();

      return;
    }


    if(!validEmail(email)){

      showMessage(
        'Please enter a valid email address.'
      );

      emailInput.focus();

      return;
    }


    if(password.length < 6){

      showMessage(
        'Password must contain at least 6 characters.'
      );

      passwordInput.focus();

      return;
    }


    registerBtn.disabled=true;

    registerBtn.textContent=
      'REGISTERING...';

    showMessage(
      'Creating your account...'
    );


    try{

      /* ===================================================
         CREATE SUPABASE AUTH USER
      =================================================== */

      const {
        data:authData,
        error:authError
      } = await sb.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            full_name:full_name,
            phone:phone
          }
        }

      });


      if(authError){

        console.error(
          'AUTH ERROR:',
          authError
        );

        throw authError;
      }


      if(!authData || !authData.user){

        throw new Error(
          'Supabase did not return a user account.'
        );
      }


      const userId =
        authData.user.id;


      showMessage(
        'Account created. Saving membership...'
      );


      /* ===================================================
         MEMBER RECORD
      =================================================== */

      const memberRecord = {

        user_id:userId,

        full_name:full_name,

        phone:phone || null,

        email:email,

        status:'pending'

      };


      const {
        data:memberData,
        error:memberError
      } = await sb

        .from('members')

        .insert([
          memberRecord
        ])

        .select();


      if(memberError){

        console.error(
          'MEMBER ERROR:',
          memberError
        );


        /*
          Account exists in Supabase Auth but
          members table insert failed.
        */

        throw new Error(
          'Your login account was created, but your membership could not be saved. ' +
          memberError.message
        );

      }


      console.log(
        'Member created:',
        memberData
      );


      /* ===================================================
         SUCCESS
      =================================================== */

      showMessage(
        'Registration successful! Your account is waiting for administrator approval.',
        '#43e38b'
      );


      fullNameInput.value='';
      phoneInput.value='';
      emailInput.value='';
      passwordInput.value='';


      /*
        Redirect after 3 seconds
      */

      setTimeout(
        function(){

          window.location.href =
            'login.html';

        },
        3000
      );


    }
    catch(error){

      console.error(
        'REGISTRATION ERROR:',
        error
      );


      let message =
        error?.message ||
        'Registration failed. Please try again.';


      /*
        Friendlier Supabase messages
      */

      if(
        message
        .toLowerCase()
        .includes('already registered')
      ){

        message =
          'This email is already registered. Please use the Login page.';
      }


      if(
        message
        .toLowerCase()
        .includes('user already registered')
      ){

        message =
          'This email is already registered. Please use the Login page.';
      }


      if(
        message
        .toLowerCase()
        .includes('load failed')
      ){

        message =
          'Could not connect to Supabase. Please check the internet connection and Supabase project settings.';
      }


      if(
        message
        .toLowerCase()
        .includes('row-level security')
      ){

        message =
          'The account was created, but Supabase is blocking the members table. Run the members-table SQL policy.';
      }


      showMessage(
        message,
        '#ff8080'
      );

    }
    finally{

      registerBtn.disabled=false;

      registerBtn.textContent=
        'REGISTER';

    }

  }
);


/* =========================================================
   ENTER KEY
========================================================= */

[
  fullNameInput,
  phoneInput,
  emailInput,
  passwordInput
]
.forEach(function(input){

  input.addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        event.preventDefault();

        registerBtn.click();

      }

    }
  );

});

</script>

</body>
</html>
