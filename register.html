<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Voice of Peace - Register</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top,#0c4f7e 0,#062c4f 35%,#02182e 70%,#010b15 100%);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

.wrap {
  max-width: 560px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: rgba(6,39,70,.96);
  border: 1px solid #245d88;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

h1 {
  text-align: center;
  margin: 5px 0;
  font-size: 34px;
}

.subtitle {
  text-align: center;
  color: #4bd0ff;
  margin-bottom: 25px;
}

h2 {
  text-align: center;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border-radius: 12px;
  border: 1px solid #2b6c99;
  background: #fff;
  color: #111;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border-radius: 12px;
  border: 0;
  background: #13b868;
  color: white;
  font-weight: 800;
  font-size: 18px;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.link {
  display: block;
  text-align: center;
  color: #4bd0ff;
  margin-top: 18px;
  text-decoration: none;
}

.link:hover {
  text-decoration: underline;
}

.msg {
  min-height: 28px;
  color: #ffd34f;
  text-align: center;
  padding: 8px;
  font-weight: bold;
}

.success {
  color: #64ff9b;
}

.error {
  color: #ff8080;
}

.small {
  text-align: center;
  font-size: 13px;
  color: #b9d7ea;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>VOICE OF PEACE</h1>

    <div class="subtitle">
      By Emmanuel &amp; Camili Hileah
    </div>

    <h2>Create Member Account</h2>

    <div id="msg" class="msg"></div>

    <label for="fullname">Full Name</label>
    <input
      id="fullname"
      type="text"
      placeholder="Full name"
      autocomplete="name"
    >

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Create password"
      autocomplete="new-password"
    >

    <label for="confirmPassword">Confirm Password</label>
    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm password"
      autocomplete="new-password"
    >

    <button id="registerBtn" type="button">
      REGISTER
    </button>

    <a
      class="link"
      href="login.html"
    >
      Already registered? Login
    </a>

    <a
      class="link"
      href="index.html"
    >
      Return to Voice of Peace
    </a>

    <div class="small">
      After registration, check your email and click the confirmation link.
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   VOICE OF PEACE - SUPABASE SETTINGS
========================================================= */

const SUPABASE_URL =
  "https://dpejswtreoqzmrlcnfde.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_92C4dFnhmFBCsasew_6WhQ_InvX4yDX";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   IMPORTANT:
   THIS IS WHERE EMAIL CONFIRMATION RETURNS THE USER
========================================================= */

const EMAIL_CONFIRM_REDIRECT =
  "https://mano34911.github.io/Voice-of-Peace/login.html";


/* =========================================================
   ELEMENTS
========================================================= */

const fullnameInput =
  document.getElementById("fullname");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const registerBtn =
  document.getElementById("registerBtn");

const msg =
  document.getElementById("msg");


function showMessage(text,type="") {

  msg.textContent = text;

  msg.className = "msg";

  if(type === "success") {
    msg.classList.add("success");
  }

  if(type === "error") {
    msg.classList.add("error");
  }

}


/* =========================================================
   REGISTER
========================================================= */

async function registerUser() {

  const fullname =
    fullnameInput.value.trim();

  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;

  const confirmPassword =
    confirmPasswordInput.value;


  if(!fullname) {

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;
  }


  if(!email) {

    showMessage(
      "Please enter your email.",
      "error"
    );

    return;
  }


  if(!password) {

    showMessage(
      "Please create a password.",
      "error"
    );

    return;
  }


  if(password.length < 6) {

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }


  if(password !== confirmPassword) {

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  registerBtn.disabled = true;

  registerBtn.textContent =
    "CREATING ACCOUNT...";

  showMessage(
    "Creating your account..."
  );


  try {

    /* =============================================
       CREATE SUPABASE AUTH ACCOUNT
    ============================================= */

    const {
      data,
      error
    } = await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options: {

        emailRedirectTo:
          EMAIL_CONFIRM_REDIRECT,

        data: {

          full_name: fullname,

          role: "member",

          approval_status: "pending"

        }

      }

    });


    if(error) {

      throw error;

    }


    /* =============================================
       TRY TO CREATE MEMBER DATABASE RECORD
    ============================================= */

    if(data.user) {

      try {

        const {
          error: memberError
        } = await supabaseClient
          .from("members")
          .insert({

            user_id:
              data.user.id,

            full_name:
              fullname,

            email:
              email,

            status:
              "pending",

            approved:
              false

          });


        if(memberError) {

          console.log(
            "Member table message:",
            memberError.message
          );

        }

      }
      catch(memberTableError) {

        console.log(
          "Member record skipped:",
          memberTableError
        );

      }

    }


    /* =============================================
       EMAIL CONFIRMATION REQUIRED
    ============================================= */

    if(
      data.user &&
      !data.session
    ) {

      showMessage(
        "Registration successful! Check your email and click the confirmation link. After confirmation you will return to the Voice of Peace login page.",
        "success"
      );

      registerBtn.textContent =
        "CHECK YOUR EMAIL";

      return;

    }


    /* =============================================
       IF EMAIL CONFIRMATION IS DISABLED
    ============================================= */

    if(data.session) {

      showMessage(
        "Account created successfully. Redirecting to login...",
        "success"
      );


      setTimeout(function(){

        window.location.href =
          "login.html";

      },2000);

    }


  }
  catch(error) {

    console.error(error);

    showMessage(
      error.message ||
      "Registration failed. Please try again.",
      "error"
    );

    registerBtn.disabled = false;

    registerBtn.textContent =
      "REGISTER";

  }

}


/* =========================================================
   REGISTER BUTTON
========================================================= */

registerBtn.addEventListener(
  "click",
  registerUser
);


/* =========================================================
   ALLOW ENTER KEY
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if(event.key === "Enter") {

      registerUser();

    }

  }
);

</script>

</body>
</html>
