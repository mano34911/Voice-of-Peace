<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">

<title>Voice of Peace - Register</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#0c4f7e 0,#062c4f 35%,#02182e 70%,#010b15 100%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:620px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#062746;
  border:1px solid #245d88;
  border-radius:22px;
  padding:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo h1{
  margin:0;
  font-size:40px;
  letter-spacing:3px;
}

.logo p{
  color:#4bd0ff;
  font-size:22px;
}

.notice{
  background:#0a3d64;
  border:1px solid #2c73a0;
  border-radius:12px;
  padding:13px;
  text-align:center;
  color:#c9efff;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:14px;
  font-weight:700;
}

input,
select,
button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #2b6c99;
  font-size:16px;
}

input,
select{
  background:#fff;
  color:#111;
}

button{
  margin-top:24px;
  background:#13b868;
  color:white;
  font-weight:800;
  border:0;
  cursor:pointer;
}

.link{
  display:block;
  text-align:center;
  color:#4bd0ff;
  margin-top:18px;
  text-decoration:none;
}

.msg{
  min-height:24px;
  text-align:center;
  margin-top:14px;
  color:#ffd34f;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="logo">
      <h1>VOICE OF PEACE</h1>
      <p>Create Account</p>
    </div>

    <div class="notice">
      Temporary open registration is enabled.
    </div>

    <form id="registerForm">

      <label>First Name</label>
      <input id="firstName" type="text" placeholder="First name">

      <label>Last Name</label>
      <input id="lastName" type="text" placeholder="Last name">

      <label>Email</label>
      <input id="email" type="email" placeholder="Email">

      <label>Phone</label>
      <input id="phone" type="tel" placeholder="Phone number">

      <label>Street Address</label>
      <input id="address" type="text" placeholder="Street address">

      <label>City</label>
      <input id="city" type="text" placeholder="City">

      <label>State</label>
      <input id="state" type="text" placeholder="State">

      <label>ZIP Code</label>
      <input id="zip" type="text" placeholder="ZIP code">

      <label>Referred By</label>
      <input id="referredBy" type="text" placeholder="Who referred you?">

      <label>Password</label>
      <input id="password" type="password" placeholder="Password">

      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Confirm password">

      <button type="submit">
        REGISTER
      </button>

    </form>

    <div id="msg" class="msg"></div>

    <a class="link" href="login.html">
      Already registered? Login
    </a>

    <a class="link" href="index.html">
      Return to Voice of Peace
    </a>

  </div>
</div>

<script>
(function(){

  const form = document.getElementById("registerForm");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", function(event){

    event.preventDefault();

    const firstName =
      document.getElementById("firstName").value.trim();

    const lastName =
      document.getElementById("lastName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const address =
      document.getElementById("address").value.trim();

    const city =
      document.getElementById("city").value.trim();

    const state =
      document.getElementById("state").value.trim();

    const zip =
      document.getElementById("zip").value.trim();

    const referredBy =
      document.getElementById("referredBy").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if(!firstName || !lastName || !email){
      msg.textContent =
        "Please enter your name and email.";
      return;
    }

    if(password !== confirmPassword){
      msg.textContent =
        "Passwords do not match.";
      return;
    }

    const member = {
      id: Date.now(),
      firstName,
      lastName,
      email,
      phone,
      address,
      city,
      state,
      zip,
      referredBy,
      status: "active",
      createdAt: new Date().toISOString()
    };

    let members = [];

    try{
      members =
        JSON.parse(localStorage.getItem("voiceOfPeaceMembers")) || [];
    }catch(e){
      members = [];
    }

    const alreadyExists =
      members.some(m =>
        String(m.email).toLowerCase() ===
        email.toLowerCase()
      );

    if(!alreadyExists){
      members.push(member);

      localStorage.setItem(
        "voiceOfPeaceMembers",
        JSON.stringify(members)
      );
    }

    localStorage.setItem(
      "voiceOfPeaceAccess",
      "granted"
    );

    localStorage.setItem(
      "voiceOfPeaceCurrentUser",
      email
    );

    msg.textContent =
      "Registration complete. Opening Voice of Peace...";

    setTimeout(function(){
      window.location.href = "index.html";
    },700);

  });

})();
</script>

</body>
</html>
